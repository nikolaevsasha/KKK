<script>

const splash = document.getElementById('splash');

splash.addEventListener('click', () => splash.classList.add('hide'));

// Уведомления Саше о нажатиях (через ntfy.sh)
const NTFY_TOPIC = 'katya-sasha-serdechko-x8k2v9q4';
function notify(text) {
  fetch('https://ntfy.sh/' + NTFY_TOPIC, {
    method: 'POST',
    body: text,
    headers: { 'Tags': 'heart' },
  }).catch(() => {});
}

// Мягкие звуки через WebAudio
let soundOn = localStorage.getItem('soundOn') !== '0';
const soundBtn = document.getElementById('soundBtn');
function renderSound() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
renderSound();
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('soundOn', soundOn ? '1' : '0');
  renderSound();
  if (soundOn) playPop();
});
let audioCtx;
function playTone(freq, dur, delay, type = 'sine', vol = 0.12) {
  const t = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playPop() {
  if (!soundOn) return;
  ensureCtx();
  playTone(660, 0.12, 0);
  playTone(880, 0.15, 0.06);
}
function playChime() {
  if (!soundOn) return;
  ensureCtx();
  [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.35, i * 0.09, 'sine', 0.09));
}

// --- Автообнаружение фото в папке photos/ ---
// Галерея: photos/gallery1.jpg, gallery2.jpg, ... (также .jpeg/.png)
// Фото к настроениям: photos/sad1.jpg, tired1.jpg, happy2.png и т.д.
const EXTS = ['jpg', 'jpeg', 'png', 'webp'];
const MAX_PROBE = 30;

// Основной источник — photos/manifest.json; поиск по именам остаётся запасным
let manifest = null;
const manifestReady = fetch('photos/manifest.json?v=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(m => { manifest = m; })
  .catch(() => {});

function probeImage(base) {
  return new Promise(resolve => {
    let i = 0;
    function tryNext() {
      if (i >= EXTS.length) return resolve(null);
      const url = `photos/${base}.${EXTS[i++]}`;
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = tryNext;
      img.src = url;
    }
    tryNext();
  });
}

async function discover(prefix, max) {
  const found = [];
  for (let n = 1; n <= max; n++) {
    const url = await probeImage(prefix + n);
    if (!url) break;
    found.push(url);
  }
  return found;
}

const card = document.getElementById('card');
const lastShown = {};

// --- Слайдшоу галереи ---
async function initGallery() {
  await manifestReady;
  let urls;
  if (manifest && manifest.gallery && manifest.gallery.length) {
    urls = manifest.gallery.map(f => 'photos/' + f);
  } else {
    urls = await discover('gallery', MAX_PROBE);
  }
  if (!urls.length) return;
  const gallery = document.getElementById('gallery');
  const frame = document.getElementById('frame');
  const dots = document.getElementById('dots');
  gallery.style.display = 'flex';
  const imgs = urls.map((u, idx) => {
    const img = document.createElement('img');
    img.dataset.src = u;
    img.decoding = 'async';
    if (idx === 0) img.classList.add('active');
    frame.appendChild(img);
    const d = document.createElement('span');
    if (idx === 0) d.classList.add('on');
    d.addEventListener('click', () => show(idx));
    dots.appendChild(d);
    return img;
  });
  function ensure(idx) {
    const im = imgs[(idx + imgs.length) % imgs.length];
    if (!im.src) im.src = im.dataset.src;
  }
  let cur = 0, timer;
  function show(idx) {
    imgs[cur].classList.remove('active');
    dots.children[cur].classList.remove('on');
    cur = (idx + imgs.length) % imgs.length;
    ensure(cur); ensure(cur + 1); ensure(cur - 1);
    imgs[cur].classList.add('active');
    dots.children[cur].classList.add('on');
    restart();
  }
  function restart() {
    clearInterval(timer);
    timer = setInterval(() => show(cur + 1), 4000);
  }
  document.getElementById('prevBtn').addEventListener('click', () => show(cur - 1));
  document.getElementById('nextBtn').addEventListener('click', () => show(cur + 1));
  ensure(0); ensure(1);
  restart();
}

async function initMoodPhotos() {
  await manifestReady;
  const all = (manifest && manifest.gallery) ? manifest.gallery.map(f => 'photos/' + f) : [];
  for (const mood of Object.keys(messages)) {
    const fromManifest = manifest && manifest.moods && manifest.moods[mood];
    if (fromManifest && fromManifest.length) {
      moodPhotos[mood] = fromManifest.map(f => 'photos/' + f);
    } else {
      const probed = await discover(mood, 10);
      // если именованных фото нет — берём случайные из общей галереи
      moodPhotos[mood] = probed.length ? probed : all;
    }
  }
}

initGallery();
initMoodPhotos();

// --- Вылетающие мемы (photos/meme1.jpg, meme2.jpg, ...) ---
let memes = [];
manifestReady.then(async () => {
  if (manifest && manifest.memes && manifest.memes.length) {
    memes = manifest.memes.map(f => 'photos/' + f);
  } else {
    memes = await discover('meme', 30);
  }
});

// мемы, подходящие под настроение (по ключевым словам в имени файла)
const memeMoodKeys = {
  sad: ['support', 'cute'],
  tired: ['hard-day', 'good-morning'],
  angry: ['excuse-me', 'weird'],
  miss: ['dog', 'wedding'],
  anxious: ['confused', 'forgetful', 'support'],
  happy: ['happy', 'super-cute', 'good-morning'],
};

function maybeMeme(chance = 0.35, mood = null) {
  if (!memes.length || Math.random() > chance) return;
  let pool = memes;
  if (mood && memeMoodKeys[mood]) {
    const matched = memes.filter(u => memeMoodKeys[mood].some(k => u.includes(k)));
    if (matched.length) pool = matched;
  }
  const img = document.createElement('img');
  img.src = pool[Math.floor(Math.random() * pool.length)];
  const fromLeft = Math.random() < 0.5;
  Object.assign(img.style, {
    position: 'fixed',
    top: (15 + Math.random() * 50) + 'vh',
    left: fromLeft ? '-45vw' : '105vw',
    width: 'min(60vw, 300px)',
    borderRadius: '18px',
    boxShadow: '0 10px 30px rgba(80,20,35,0.4)',
    zIndex: 25,
    transition: 'transform 9s ease-in-out',
    transform: 'translateX(0) rotate(' + (Math.random() * 20 - 10) + 'deg)',
    cursor: 'pointer',
  });
  document.body.appendChild(img);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    img.style.transform = 'translateX(' + (fromLeft ? '160vw' : '-160vw') + ') rotate(' + (Math.random() * 30 - 15) + 'deg)';
  }));
  img.addEventListener('click', () => img.remove());
  setTimeout(() => img.remove(), 9300);
}

// --- Мини-игра «Поймай сердечки» ---
const gameBg = document.getElementById('gameBg');
const gameScoreEl = document.getElementById('gameScore');
const gameTimeEl = document.getElementById('gameTime');
const gameEnd = document.getElementById('gameEnd');
const gameEndText = document.getElementById('gameEndText');
const GAME_SECONDS = 30;
let gScore = 0, gTime = 0, gSpawn = null, gTick = null;

function startGame() {
  gScore = 0; gTime = GAME_SECONDS;
  gameEnd.classList.remove('show');
  gameBg.querySelectorAll('.game-heart').forEach(h => h.remove());
  gameScoreEl.textContent = 'Счёт: 0';
  gameTimeEl.textContent = gTime + ' с';
  gameBg.classList.add('open');
  gSpawn = setInterval(spawnGameHeart, 520);
  gTick = setInterval(() => {
    gTime--;
    gameTimeEl.textContent = gTime + ' с';
    if (gTime <= 0) finishGame();
  }, 1000);
}

function spawnGameHeart() {
  const h = document.createElement('div');
  h.className = 'game-heart';
  h.textContent = ['💗','💖','💘','🩷'][Math.floor(Math.random() * 4)];
  h.style.left = (5 + Math.random() * 85) + 'vw';
  h.style.fontSize = (26 + Math.random() * 26) + 'px';
  h.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
  h.addEventListener('pointerdown', e => {
    e.preventDefault();
    gScore++;
    gameScoreEl.textContent = 'Счёт: ' + gScore;
    playPop();
    h.textContent = '✨';
    h.style.pointerEvents = 'none';
    setTimeout(() => h.remove(), 150);
  });
  h.addEventListener('animationend', () => h.remove());
  gameBg.appendChild(h);
}

function finishGame() {
  clearInterval(gSpawn); clearInterval(gTick);
  gameBg.querySelectorAll('.game-heart').forEach(h => h.remove());
  const record = Number(localStorage.getItem('gameRecord') || 0);
  let text = `Ты поймала ${gScore} сердечек!`;
  if (gScore > record) {
    localStorage.setItem('gameRecord', gScore);
    text += '<br>Новый рекорд!';
    notify(`Катя поставила рекорд в игре: ${gScore} сердечек! 🏆`);
  } else if (record) {
    text += `<br>Рекорд: ${record}`;
  }
  gameEndText.innerHTML = text;
  gameEnd.classList.add('show');
  playChime();
}

function closeGame() {
  clearInterval(gSpawn); clearInterval(gTick);
  gameBg.classList.remove('open');
  gameEnd.classList.remove('show');
  gameBg.querySelectorAll('.game-heart').forEach(h => h.remove());
}

// --- Музыкальный плеер (music/manifest.json: [{"file": "...", "title": "..."}]) ---
async function initPlayer() {
  let tracks = [];
  try {
    const r = await fetch('music/manifest.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) tracks = await r.json();
  } catch {}
  if (!tracks.length) return;
  const player = document.getElementById('player');
  const audio = document.getElementById('audio');
  const nowEl = document.getElementById('playerNow');
  const listEl = document.getElementById('playerList');
  const playBtn = document.getElementById('playPause');
  const progress = document.getElementById('playerProgress');
  player.style.display = 'flex';
  let cur = 0;

  tracks.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'player-track';
    b.textContent = t.title || t.file;
    b.addEventListener('click', () => { load(i); play(); });
    listEl.appendChild(b);
  });

  let knownDuration = 0;
  function load(i) {
    cur = (i + tracks.length) % tracks.length;
    audio.src = 'music/' + tracks[cur].file;
    audio.preload = 'metadata';
    knownDuration = 0;
    progress.value = 0;
    nowEl.textContent = tracks[cur].title || tracks[cur].file;
    [...listEl.children].forEach((el, j) => el.classList.toggle('playing', j === cur));
  }
  function play() { audio.play(); playBtn.textContent = '⏸'; }
  function pause() { audio.pause(); playBtn.textContent = '▶'; }

  playBtn.addEventListener('click', () => audio.paused ? play() : pause());
  document.getElementById('prevTrack').addEventListener('click', () => { load(cur - 1); play(); });
  document.getElementById('nextTrack').addEventListener('click', () => { load(cur + 1); play(); });
  audio.addEventListener('ended', () => { load(cur + 1); play(); });

  // если браузер не знает длительность (Infinity у некоторых mp3),
  // заставляем его домотать до конца и вернуться: после этого длительность известна
  audio.addEventListener('loadedmetadata', () => {
    if (audio.duration === Infinity || isNaN(audio.duration)) {
      const onDur = () => {
        if (isFinite(audio.duration) && audio.duration > 0) {
          knownDuration = audio.duration;
          audio.currentTime = 0;
          audio.removeEventListener('durationchange', onDur);
        }
      };
      audio.addEventListener('durationchange', onDur);
      audio.currentTime = 1e101;
    } else {
      knownDuration = audio.duration;
    }
  });

  // не обновляем ползунок, пока Катя его тащит
  let seeking = false;
  audio.addEventListener('timeupdate', () => {
    if (!seeking && knownDuration) progress.value = (audio.currentTime / knownDuration) * 100;
  });
  const doSeek = () => {
    if (knownDuration) audio.currentTime = (progress.value / 100) * knownDuration;
  };
  ['pointerdown', 'touchstart'].forEach(e => progress.addEventListener(e, () => { seeking = true; }));
  ['pointerup', 'touchend'].forEach(e => progress.addEventListener(e, () => { doSeek(); seeking = false; }));
  progress.addEventListener('change', () => { doSeek(); seeking = false; });
  load(0);
}
initPlayer();
