<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Finch — Personal Finance</title>
  <meta name="description" content="Self-hosted personal finance dashboard">
  <meta name="theme-color" content="#0c1f30">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finch">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="11" fill="#0c1f30"/>
          <path d="M10 32 L18 23 L25 27 L38 13" fill="none" stroke="#eb6834" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="38" cy="13" r="3.4" fill="#eb6834" stroke="#0c1f30" stroke-width="2"/>
        </svg>
      </div>
      <h1 id="auth-title">Welcome to Finch</h1>
      <p id="auth-sub" class="auth-sub">Your money, on your own server.</p>
      <form id="auth-form">
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required minlength="6">
        <input type="password" id="auth-password2" class="hidden" placeholder="Repeat password" autocomplete="new-password" minlength="6">
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Log in</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="11" fill="rgba(255,255,255,0.08)"/>
          <path d="M10 32 L18 23 L25 27 L38 13" fill="none" stroke="#eb6834" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="38" cy="13" r="3.4" fill="#eb6834"/>
        </svg>
        <span>Finch</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <button class="nav-item" id="logout-btn" type="button">
          <span class="nav-icon">↪</span><span>Log out</span>
        </button>
      </div>
    </aside>

    <main class="main" id="main"></main>

    <nav class="tabbar" id="tabbar"></nav>

    <button class="fab" id="fab" title="Add transaction" aria-label="Add transaction">+</button>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="chart-tip" class="chart-tip hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
