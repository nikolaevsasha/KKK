<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Finch — Personal Finance</title>
  <meta name="description" content="Self-hosted personal finance dashboard">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finch">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo" id="auth-logo"></div>
      <h1 id="auth-title">Welcome to Finch</h1>
      <p id="auth-sub" class="auth-sub">Your money, on your own server.</p>
      <form id="auth-form">
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required minlength="6">
        <input type="password" id="auth-password2" class="hidden" placeholder="Repeat password" autocomplete="new-password" minlength="6">
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Log in</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <a class="brand" href="#/dashboard" aria-label="Finch home" id="brand"></a>
        <div class="topbar-tools" id="topbar-tools"></div>
      </div>
      <div class="topbar-main">
        <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
        <nav class="topbar-tabs" id="topbar-tabs"></nav>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-foot">
          <button class="nav-item" id="help-btn" type="button"></button>
          <button class="nav-item user-chip" id="user-chip" type="button"></button>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
    <button class="fab" id="fab" title="Add transaction" aria-label="Add transaction"></button>
  </div>

  <div id="modal-root"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="chart-tip" class="chart-tip hidden"></div>

  <script src="/icons.js"></script>
  <script src="/charts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
