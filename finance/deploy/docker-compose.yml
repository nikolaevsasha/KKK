services:
  finch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: finch
    restart: unless-stopped
    # Bind to localhost only — terminate TLS with a reverse proxy in front.
    ports:
      - "127.0.0.1:8484:8484"
    volumes:
      - finch-data:/data

volumes:
  finch-data:
