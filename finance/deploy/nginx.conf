# Finch reverse proxy. Replace finch.example.com with your domain, then run
# `certbot --nginx -d your-domain` to add TLS (it rewrites this file).

server {
    listen 80;
    listen [::]:80;
    server_name finch.example.com;

    # Keep response bodies small and safe.
    client_max_body_size 2m;

    # Security headers (HSTS is added by certbot's HTTPS block).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The service worker must never be cached by the proxy.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8484;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
